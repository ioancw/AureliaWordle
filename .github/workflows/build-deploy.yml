name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Also restores the Fable tool (postinstall runs `dotnet tool restore`).
      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build -- --base=/AureliaWordle/

      # The experimental Bolero (WebAssembly) version; built to check it still compiles, not deployed.
      - name: Build Bolero version
        run: npm run build:bolero

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Publishes to the gh-pages branch, which GitHub Pages already serves.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          commit_message: Deploy ${{ github.sha }}
